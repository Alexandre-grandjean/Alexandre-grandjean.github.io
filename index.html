<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Alexandre Grandjean — portfolio</title>
    <meta http-equiv="refresh" content="0; url=/portfolio/" />
    <link rel="canonical" href="https://alexandre-grandjean.github.io/portfolio/" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #030409;
        color: #7f8da3;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #9fc4f0;
        box-shadow: 0 0 12px #9fc4f0;
        animation: pulse 1.6s ease-in-out infinite;
      }
      a {
        color: #e6ecf5;
        text-decoration: none;
        border-bottom: 1px solid rgba(159, 196, 240, 0.4);
        padding-bottom: 2px;
      }
      a:hover {
        border-color: #9fc4f0;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="dot"></div>
      <p>Redirection vers le portfolio</p>
      <p><a href="/portfolio/">alexandre-grandjean.github.io/portfolio/</a></p>
    </main>
    <script>
      location.replace("/portfolio/");
    </script>
  </body>
</html>
